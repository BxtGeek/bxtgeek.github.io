# -----------------------
# Basic Site Settings
# -----------------------
theme: jekyll-theme-chirpy
lang: en
timezone: Asia/Kolkata

title: CorpIT
tagline: Learning Storage, Linux, Virtualization, DevOps and some random stuff
description: >-
  Handmade By Talented Professionals

url: "https://bxtgeek.github.io"
baseurl: ""

# -----------------------
# Author / Social
# -----------------------
github:
  username: bxtgeek

social:
  name: Manoj Kumar
  email: bxtgeek@gmail.com
  links:
    - https://github.com/yourusername

# -----------------------
# Appearance
# -----------------------
theme_mode: dark   # light | dark | (leave empty for auto)
avatar: "/assets/img/avatar.png"

toc: true

# -----------------------
# Analytics (optional)
# -----------------------
analytics:
  google:
    id: ""

# -----------------------
# PWA
# -----------------------
pwa:
  enabled: true
  cache:
    enabled: true

# -----------------------
# Pagination
# -----------------------
paginate: 10

# -----------------------
# Defaults
# -----------------------
collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# -----------------------
# Build Settings
# -----------------------
sass:
  style: compressed

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

compress_html:
  clippings: all
  comments: all
  endings: all
  blanklines: false

exclude:
  - "*.gem"
  - "*.gemspec"
  - node_modules
  - README.md
  - LICENSE

# -----------------------
# Footer
# -----------------------
social:
social:
  name: CorpIT.org

# -----------------------
# Custom Assets
# -----------------------
assets:
  css:
    - /assets/css/custom.css