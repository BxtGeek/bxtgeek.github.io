# -----------------------
# Basic Site Settings
# -----------------------
theme: jekyll-theme-chirpy
lang: en
timezone: Asia/Kolkata

title: CorpIT
tagline: Technical Notes & Labs
description: >-
  Personal site for labs, notes, and technical writeups.

url: "https://bxtgeek.github.io"
baseurl: ""

# -----------------------
# Author / Social
# -----------------------
github:
  username: bxtgeek

social:
  name: Your Name
  email: your@email.com
  links:
    - https://github.com/yourusername

# -----------------------
# Appearance
# -----------------------
theme_mode: dark   # light | dark | (leave empty for auto)
avatar: "/assets/img/avatar.png"

toc: true

# -----------------------
# Analytics (optional)
# -----------------------
analytics:
  google:
    id: ""

# -----------------------
# Comments (optional)
# -----------------------
comments:
  provider: utterances
  utterances:
    repo: yourusername/yourusername.github.io
    issue_term: pathname

# -----------------------
# PWA
# -----------------------
pwa:
  enabled: true
  cache:
    enabled: true

# -----------------------
# Pagination
# -----------------------
paginate: 10

# -----------------------
# Defaults
# -----------------------
collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# -----------------------
# Build Settings
# -----------------------
sass:
  style: compressed

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

compress_html:
  clippings: all
  comments: all
  endings: all
  blanklines: false
  
exclude:
  - "*.gem"
  - "*.gemspec"
  - node_modules
  - README.md
  - LICENSE