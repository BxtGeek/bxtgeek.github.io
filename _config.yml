# Basic Site Settings

theme: jekyll-theme-chirpy
lang: en
timezone: Asia/Kolkata

title: CorpIT
tagline: Learning Storage, Linux, Virtualization, DevOps and some random stuff
description: >-
  Handmade By Talented Professionals

url: "https://bxtgeek.github.io"
baseurl: ""

# Author / Social

github:
  username: bxtgeek

social:
  name: Manoj Kumar
  email: bxtgeek@gmail.com
  links:
    - https://github.com/bxtgeek

# Appearance

theme_mode: dark
avatar: "/assets/img/avatar.png"
toc: true

# Analytics (optional)

analytics:
  google:
    id: ""

# PWA (keep enabled for caching)

pwa:
  enabled: true
  cache:
    enabled: true

# Pagination

paginate: 10

# Collections

collections:
  tabs:
    output: true
    sort_by: order

# Defaults

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Performance Optimizations

# ✅ Compress CSS
sass:
  style: compressed

# ✅ HTML compression (you already had it, cleaned)
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  blanklines: false

# ✅ Enable incremental build (dev speed, not prod but useful)
incremental: true

# Markdown / Code

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

# Exclude unnecessary files

exclude:
  - "*.gem"
  - "*.gemspec"
  - node_modules
  - README.md
  - LICENSE
  - package.json
  - package-lock.json
  - yarn.lock
