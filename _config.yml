# =============================================================================
# CorpIT — custom theme configuration
# =============================================================================

# ---- Site identity ----------------------------------------------------------
title: CorpIT
tagline: Learning Storage, Linux, Virtualization, DevOps and some random stuff
description: >-
  Practical, hands-on tutorials and deep dives on Storage, Linux,
  Virtualization, DevOps, Cloud and IT infrastructure — written by
  working professionals for learners and practitioners.

url: "https://corpit.org"
baseurl: ""

lang: en
timezone: Asia/Kolkata

# ---- Author (used by jekyll-seo-tag for meta authors; the primary author) ----
author:
  name: Manoj Kumar
  email: bxtgeek@gmail.com
  twitter: bxtgeek

# Slug into `_data/authors.yml` used when a post does not set `author:` itself.
default_author: manoj

# ---- Appearance -------------------------------------------------------------
# One of: "dark", "light", "auto" (auto follows the OS via JS).
theme_mode: dark
avatar: /assets/img/avatar.png
# Show the post's cover image on the blog list cards.
show_post_cover: true

# ---- Collections ------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:title/

# ---- Defaults ---------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
      comments: true
      toc: true
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# ---- Plugins ----------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-redirect-from

# ---- Pagination (jekyll-paginate-v2) ----------------------------------------
pagination:
  enabled: true
  per_page: 10
  permalink: /page/:num/
  limit: 0
  sort_field: date
  sort_reverse: true
  title: ":title — page :num"
  trail:
    before: 2
    after: 2

# ---- Feed -------------------------------------------------------------------
feed:
  path: /feed.xml
  posts_limit: 10

# ---- SEO / social -----------------------------------------------------------
twitter:
  username: bxtgeek

social:
  name: Manoj Kumar
  links:
    - https://github.com/bxtgeek
    - https://x.com/bxtgeek
    - https://www.linkedin.com/in/bxtgeek/
    - https://www.youtube.com/@corp-it

# ---- Comments (giscus) — fill these in before going live --------------------
giscus:
  repo: bxtgeek/corpit.org
  repo_id: ""
  category: Announcements
  category_id: ""
  mapping: pathname
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: bottom
  theme: preferred_color_scheme
  lang: en

# ---- Search -----------------------------------------------------------------
# Pagefind is run against the built site by the GitHub Actions workflow and by
# `npm run search` locally. Set `search: false` to disable the search page.
search:
  enabled: true

# ---- Markdown / kramdown ----------------------------------------------------
markdown: kramdown
kramdown:
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

# ---- Sass -------------------------------------------------------------------
sass:
  style: compressed
  sourcemap: never

# ---- Exclude from the build -------------------------------------------------
exclude:
  - "*.gem"
  - "*.gemspec"
  - node_modules
  - README.md
  - LICENSE
  - package.json
  - package-lock.json
  - yarn.lock
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github