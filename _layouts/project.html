---
layout: default
---

<article class="project">
  <div class="container container--narrow">
    {% include breadcrumbs.html %}

    <header class="project-header">
      <h1 class="project-title">{{ page.title }}</h1>
      <div class="project-meta">
        {% if page.status %}
          <span class="badge badge-status badge-status--{{ page.status | slugify }}">{{ page.status }}</span>
        {% endif %}
        {% for tag in page.tags %}
          <a class="badge" href="{{ tag | slugify | prepend: '/tags/' | append: '/' | relative_url }}">{{ tag }}</a>
        {% endfor %}
      </div>
    </header>

    <div class="prose">
      {{ content }}
    </div>

    {% if page.repo %}
      <a class="btn btn-primary" href="{{ page.repo }}" target="_blank" rel="noopener">View repository &rarr;</a>
    {% endif %}
  </div>
</article>
