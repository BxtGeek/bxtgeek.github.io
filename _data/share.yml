# Share buttons shown at the bottom of a post. Placeholders `{{ title }}` and
# `{{ url }}` are replaced by _includes/share.html.
- label: X
  icon: x
  url: "https://twitter.com/intent/tweet?text={{ title }}&url={{ url }}"
- label: Facebook
  icon: facebook
  url: "https://www.facebook.com/sharer/sharer.php?u={{ url }}"
- label: LinkedIn
  icon: linkedin
  url: "https://www.linkedin.com/sharing/share-offsite/?url={{ url }}"
- label: Telegram
  icon: telegram
  url: "https://t.me/share/url?url={{ url }}&text={{ title }}"
- label: Copy link
  icon: link
  url: "{{ url }}"
