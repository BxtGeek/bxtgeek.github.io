<div class="search" id="search">
  <label class="search-input-wrap">
    <span class="search-input-icon">{% include icon.html name="search" %}</span>
    <input id="search-input" class="search-input" type="search" placeholder="Search posts&hellip;" autocomplete="off" spellcheck="false">
  </label>

  <p class="search-status" id="search-status" role="status">Type to start searching.</p>
  <div id="search-results" class="search-results" aria-live="polite"></div>
</div>
